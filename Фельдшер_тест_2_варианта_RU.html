<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фельдшер — Тесты (2 варианта)</title>
    <style>
        :root {
            --primary: #3498db;
            --secondary: #2c3e50;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f39c12;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1, h2 {
            text-align: center;
            color: var(--secondary);
        }
        
        /* Экраны */
        #home-screen, #quiz-screen, #result-screen {
            display: none;
        }
        #home-screen.active, #quiz-screen.active, #result-screen.active {
            display: block;
        }

        /* Главное меню (Плашки вариантов) */
        .variants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }
        .variant-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border-bottom: 4px solid var(--primary);
        }
        .variant-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .variant-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .variant-desc {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        /* Панель навигации (номера вопросов) */
        .nav-panel {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            max-height: 150px;
            overflow-y: auto;
        }
        @media (max-width: 600px) {
            .nav-panel { grid-template-columns: repeat(5, 1fr); }
        }
        .nav-btn {
            padding: 6px 0;
            border: 1px solid #dee2e6;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: #6c757d;
            font-size: 0.9em;
            transition: all 0.2s;
        }
        .nav-btn:hover { background: #e2e6ea; }
        .nav-btn.active {
            border: 2px solid var(--primary);
            color: var(--primary);
            transform: scale(1.1);
        }
        .nav-btn.correct { background: var(--success); color: white; border-color: var(--success); }
        .nav-btn.incorrect { background: var(--danger); color: white; border-color: var(--danger); }
        
        /* Карточка вопроса */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .end-test-btn {
            background: var(--warning);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .end-test-btn:hover { background: #e67e22; }

        .question-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            min-height: 300px;
        }
        .question-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--bg);
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option {
            padding: 12px 15px;
            background: var(--bg);
            border: 1px solid #dee2e6;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.05em;
            display: flex;
            align-items: flex-start;
        }
        .option-num {
            font-weight: bold;
            margin-right: 10px;
            color: var(--primary);
            min-width: 25px;
        }
        .option:hover:not(.disabled) {
            background: #e2e6ea;
            border-color: #adb5bd;
        }
        .option.disabled { cursor: default; }
        .option.correct { background: #d4edda; border-color: #c3e6cb; color: #155724; font-weight: bold; }
        .option.correct .option-num { color: #155724; }
        .option.incorrect { background: #f8d7da; border-color: #f5c6cb; color: #721c24; font-weight: bold; }
        .option.incorrect .option-num { color: #721c24; }
        
        /* Управление внизу */
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }
        .ctrl-btn {
            padding: 12px 25px;
            border: none;
            background: var(--primary);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: opacity 0.2s;
        }
        .ctrl-btn:hover { opacity: 0.8; }
        .ctrl-btn:disabled { background: #6c757d; cursor: not-allowed; opacity: 0.5; }

        /* Экран результатов */
        .result-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .score-display {
            font-size: 3em;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
        }
        .home-btn {
            margin-top: 20px;
            background: var(--success);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .home-btn:hover { background: #27ae60; }
    </style>
</head>
<body>

    <!-- Экран выбора вариантов -->
    <div id="home-screen" class="active">
        <h1>Фельдшер — Тестовые вопросы</h1>
        <h2>Выберите вариант</h2>
        <div class="variants-grid" id="variants-grid">
            <!-- Плашки генерируются через JS -->
        </div>
    </div>

    <!-- Экран тестирования -->
    <div id="quiz-screen">
        <div class="quiz-header">
            <h2 id="current-variant-title">Вариант 1</h2>
            <button class="end-test-btn" onclick="endTest()">Завершить тест досрочно</button>
        </div>
        
        <div class="nav-panel" id="nav-panel"></div>

        <div class="question-card" id="question-card">
            <div class="question-title" id="question-title">Вопрос загружается...</div>
            <div class="options-container" id="options-container"></div>
            
            <div class="controls">
                <button class="ctrl-btn" id="prev-btn" onclick="prevQuestion()">&laquo; Назад</button>
                <button class="ctrl-btn" id="next-btn" onclick="nextQuestion()">Далее &raquo;</button>
            </div>
        </div>
    </div>

    <!-- Экран результатов -->
    <div id="result-screen">
        <div class="result-box">
            <h2>Тест завершён!</h2>
            <div class="score-display" id="score-display">0 / 100</div>
            <p id="score-text"></p>
            <button class="home-btn" onclick="goHome()">Вернуться в меню</button>
        </div>
    </div>

`;

        // Глобальный массив всех 11 вариантов
        // Индексы 0-10 соответствуют вариантам 1-11
        const variantsData = Array.from({length: 2}, () => []);

        // Парсинг текста
        function parseText() {
            let currentQuestion = null;
            
            rawText.split('\n').forEach(line => {
                line = line.trim();
                if (!line) return;

                // Игнорируем служебные заголовки
                if (/^\d+-нұсқа/i.test(line) || /^Сұрақтар саны/i.test(line) || /^Фельдшер/i.test(line) || /^Барлық/i.test(line)) {
                    return;
                }

                // Поиск номера вопроса (например, "123. Текст вопроса")
                let match = line.match(/^(\d+)\.\s+(.*)/);
                if (match) {
                    let qNum = parseInt(match[1], 10);
                    let qText = match[2];
                    
                    currentQuestion = {
                        originalText: qText,
                        options: [],
                        correctOptionText: null
                    };

                    // Распределяем вопросы по вариантам (каждые 100 вопросов = новый вариант)
                    // 1-100 -> index 0 (1-нұсқа)
                    // 101-200 -> index 1 (2-нұсқа) ... 1001-1030 -> index 10 (11-нұсқа)
                    let variantIndex = Math.floor((qNum - 1) / 100);
                    
                    if (variantIndex >= 0 && variantIndex < 2) {
                        variantsData[variantIndex].push(currentQuestion);
                    }
                } else if (currentQuestion) {
                    // Это вариант ответа
                    let isCorrect = line.endsWith('+');
                    let optText = isCorrect ? line.replace(/\+$/, '').trim() : line;
                    
                    currentQuestion.options.push({
                        text: optText,
                        isCorrect: isCorrect
                    });
                }
            });
        }

        // Функция перемешивания массива
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Рендер Главного Меню
        function renderHome() {
            const grid = document.getElementById('variants-grid');
            grid.innerHTML = '';
            
            for(let i = 0; i < 2; i++) {
                // Высчитываем ожидаемое количество вопросов (100 для 1-10, 30 для 11-го)
                let expectedCount = 100;
                let startNum = i * 100 + 1;
                let endNum = i * 100 + expectedCount;

                const card = document.createElement('div');
                card.className = 'variant-card';
                card.innerHTML = `
                    <div class="variant-title">Вариант ${i + 1}</div>
                    <div class="variant-desc">Вопросы: №${startNum} – №${endNum}</div>
                    <div class="variant-desc" style="margin-top:10px; color: ${variantsData[i].length > 0 ? '#2ecc71' : '#e74c3c'}">
                        Загружено: ${variantsData[i].length} вопросов
                    </div>
                `;
                
                // Запускаем тест только если есть спарсенные вопросы для этого варианта
                card.onclick = () => {
                    if(variantsData[i].length > 0) {
                        startQuiz(i);
                    } else {
                        alert('В этом варианте нет вопросов.');
                    }
                };
                
                grid.appendChild(card);
            }
        }

        // Состояние текущего тестирования
        let sessionQuestions = [];
        let currentIndex = 0;
        let correctAnswersCount = 0;

        function startQuiz(variantIndex) {
            // Глубокое копирование вопросов варианта, чтобы не портить оригинал при перемешивании
            sessionQuestions = JSON.parse(JSON.stringify(variantsData[variantIndex]));
            
            // Перемешиваем порядок вопросов в текущей сессии
            shuffle(sessionQuestions);
            
            // Перемешиваем варианты ответов внутри каждого вопроса
            sessionQuestions.forEach(q => {
                shuffle(q.options);
                // Сбрасываем статус ответа
                q.answered = false;
                q.userSelectedIndex = null;
            });

            currentIndex = 0;
            correctAnswersCount = 0;

            // Настройка UI
            document.getElementById('current-variant-title').textContent = `Вариант ${variantIndex + 1}`;
            switchScreen('quiz-screen');
            buildNavPanel();
            renderQuestion(0);
        }

        function buildNavPanel() {
            const nav = document.getElementById('nav-panel');
            nav.innerHTML = '';
            sessionQuestions.forEach((_, i) => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn';
                btn.id = `nav-btn-${i}`;
                btn.textContent = i + 1;
                btn.onclick = () => renderQuestion(i);
                nav.appendChild(btn);
            });
        }

        function renderQuestion(index) {
            currentIndex = index;
            const q = sessionQuestions[index];
            
            // Подсветка активной кнопки навигации
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`nav-btn-${index}`).classList.add('active');

            // Заголовок вопроса
            document.getElementById('question-title').textContent = `${index + 1}. ${q.originalText}`;

            // Отрисовка вариантов ответа
            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';
            
            q.options.forEach((opt, optIndex) => {
                const optDiv = document.createElement('div');
                optDiv.className = 'option';
                
                // Добавляем нумерацию 1, 2, 3, 4, 5
                optDiv.innerHTML = `<span class="option-num">${optIndex + 1}.</span> <span>${opt.text}</span>`;
                
                if (q.answered) {
                    optDiv.classList.add('disabled');
                    if (opt.isCorrect) {
                        optDiv.classList.add('correct');
                    } else if (q.userSelectedIndex === optIndex) {
                        optDiv.classList.add('incorrect');
                    }
                } else {
                    optDiv.onclick = () => selectOption(index, optIndex, opt.isCorrect);
                }
                
                optsContainer.appendChild(optDiv);
            });

            // Кнопки Вперед/Назад
            document.getElementById('prev-btn').disabled = (index === 0);
            document.getElementById('next-btn').disabled = (index === sessionQuestions.length - 1);
        }

        function selectOption(qIndex, selectedOptIndex, isCorrect) {
            const q = sessionQuestions[qIndex];
            if (q.answered) return;

            q.answered = true;
            q.userSelectedIndex = selectedOptIndex;

            const navBtn = document.getElementById(`nav-btn-${qIndex}`);

            if (isCorrect) {
                correctAnswersCount++;
                navBtn.classList.add('correct');
            } else {
                navBtn.classList.add('incorrect');
            }

            // Перерисовываем текущий вопрос, чтобы отобразить зеленые/красные плашки
            renderQuestion(qIndex);
        }

        function prevQuestion() {
            if (currentIndex > 0) renderQuestion(currentIndex - 1);
        }

        function nextQuestion() {
            if (currentIndex < sessionQuestions.length - 1) renderQuestion(currentIndex + 1);
        }

        // Завершение теста досрочно или полностью
        function endTest() {
            if(confirm("Уверены, что хотите завершить тест?")) {
                const total = sessionQuestions.length;
                document.getElementById('score-display').textContent = `${correctAnswersCount} / ${total}`;
                
                const percentage = Math.round((correctAnswersCount / total) * 100);
                const scoreText = document.getElementById('score-text');
                
                if (percentage >= 80) {
                    scoreText.innerHTML = `<span style="color:#2ecc71; font-weight:bold;">Отлично! (${percentage}%)</span>`;
                } else if (percentage >= 50) {
                    scoreText.innerHTML = `<span style="color:#f39c12; font-weight:bold;">Хорошо. (${percentage}%)</span>`;
                } else {
                    scoreText.innerHTML = `<span style="color:#e74c3c; font-weight:bold;">Нужно повторить материал. (${percentage}%)</span>`;
                }

                switchScreen('result-screen');
            }
        }

        function goHome() {
            switchScreen('home-screen');
        }

        function switchScreen(screenId) {
            document.getElementById('home-screen').classList.remove('active');
            document.getElementById('quiz-screen').classList.remove('active');
            document.getElementById('result-screen').classList.remove('active');
            document.getElementById(screenId).classList.add('active');
        }

        // Инициализация при загрузке страницы
        window.onload = () => {
            parseText();
            renderHome();
        };

    </script>
